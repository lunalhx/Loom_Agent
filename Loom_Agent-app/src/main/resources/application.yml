spring:
  config:
    name: Loom_Agent-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

loom:
  agent:
    long-term-memory:
      pinned-limit: 4
      min-relevance-score: 0.15
  ai:
    prompt-cache:
      openai:
        capability: KEYED_REQUEST
        retention: in_memory
      deepseek:
        capability: MESSAGE_BLOCK
        retention: in_memory
