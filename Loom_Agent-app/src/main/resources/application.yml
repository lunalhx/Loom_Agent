spring:
  config:
    name: Loom_Agent-app
    import:
      - optional:file:./docs/env/.env[.properties]
      - optional:file:../docs/env/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  ai:
    retry:
      max-attempts: 1
      on-client-errors: false
      on-http-codes:
  sql:
    init:
      mode: never

loom:
  agent:
    persistence:
      data-dir: ${LOOM_DATA_DIR:${user.home}/.loom-agent}
      busy-timeout-ms: ${SQLITE_BUSY_TIMEOUT_MS:5000}
      max-pool-size: ${SQLITE_MAX_POOL_SIZE:4}
    long-term-memory:
      pinned-limit: 4
      min-relevance-score: 0.35
      vector:
        extension-path: ${SQLITE_VEC_EXTENSION_PATH:}
